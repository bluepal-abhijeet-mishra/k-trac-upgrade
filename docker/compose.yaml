version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: ktrac-postgres
    environment:
      POSTGRES_DB: ktrac
      POSTGRES_USER: ktrac_app
      POSTGRES_PASSWORD: ktrac
    ports:
      - "5432:5432"

  valkey:
    image: valkey/valkey:7
    container_name: ktrac-valkey
    ports:
      - "6379:6379"

  kafka:
    image: bitnami/kafka:latest
    container_name: ktrac-kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    ports:
      - "9092:9092"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: ktrac-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    ports:
      - "8081:8080"

  seaweedfs:
    image: chrislusf/seaweedfs
    container_name: ktrac-seaweedfs
    command: "server -s3"
    ports:
      - "8333:8333"

  clamav:
    image: clamav/clamav
    container_name: ktrac-clamav
    ports:
      - "3310:3310"

  greenmail:
    image: greenmail/standalone:2.0.1
    container_name: ktrac-greenmail
    environment:
      GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=test:test
    ports:
      - "3025:3025"
      - "8085:8080"

  wiremock:
    image: wiremock/wiremock:latest
    container_name: ktrac-wiremock
    ports:
      - "8090:8080"
    command: --global-response-templating

  prometheus:
    image: prom/prometheus:latest
    container_name: ktrac-prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: ktrac-grafana
    ports:
      - "3000:3000"
